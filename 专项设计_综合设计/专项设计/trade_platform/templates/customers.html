{% extends "base.html" %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center;">
    <h2>客户列表 (Customer List)</h2>
    <a href="#" class="btn">+ 新增客户</a>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>姓名</th>
            <th>联系方式</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        {% for customer in customers %}
        <tr>
            <td>{{ customer.id }}</td>
            <td>{{ customer.name }}</td> 
            <td>{{ customer.phone }}</td> <td>
                <a href="#" class="btn btn-small">编辑</a>
                <a href="#" class="btn btn-small" style="background-color: #ff4444; color: white;">删除</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
